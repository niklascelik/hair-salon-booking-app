
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'hair-salon-booking-app'
include('app')

includeBuild('modules/booking-scheduler') {
    dependencySubstitution {
        substitute module('org.bookingscheduler:booking-scheduler') using project(':lib')
    }
}


dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.PREFER_SETTINGS

    repositories {
        mavenCentral()
        maven {
            url = uri('https://jitpack.io')
        }
    }
}


